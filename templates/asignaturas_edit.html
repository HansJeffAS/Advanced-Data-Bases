{% extends "base.html" %}
{% block title %}Editar Asignatura — MVC labo2{% endblock %}
{% block content %}
<h1>Editar Asignatura</h1>
<form action="{{ url_for('asignaturas.edit', id=asignatura.asignatura_id) }}" method="POST"
  style="margin-bottom: 20px;">
  <input type="text" name="nombre_es" value="{{ asignatura.nombre.get('es', '') }}" placeholder="Nombre (ES)" required>
  <input type="text" name="nombre_en" value="{{ asignatura.nombre.get('en', '') }}" placeholder="Nombre (EN)" required>
  <select name="profesor_id" required>
    <option value="">Seleccione un profesor</option>
    {% for profe in profesores %}
    <option value="{{ profe.profesor_id }}" {% if profe.profesor_id==asignatura.profesor_id %}selected{% endif %}>{{
      profe.nombre }}</option>
    {% endfor %}
  </select>
  <input type="number" name="precio" value="{{ asignatura.precio }}" min="0" step="0.01" required
    placeholder="Precio (€)">
  <input type="number" name="max_alumnos" value="{{ asignatura.max_alumnos }}" min="1" required
    placeholder="Máx. alumnos">
  <button type="submit">Guardar Cambios</button>
</form>
<a href="{{ url_for('asignaturas.list_') }}">Volver</a>
{% endblock %}
